# ── Base de données ──────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/rooms_db
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ──────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ── JWT ──────────────────────────────────────────────────────
# Secret d'au moins 32 caractères pour HS256
jwt.secret=GlamRoomSecretKey2024XyZ123456789AbCdEf
jwt.expiration=86400000

# ── Serveur ──────────────────────────────────────────────────
server.port=8080

# ── Jackson (dates en ISO string, pas en tableau) ─────────────
# WRITE_DATES_AS_TIMESTAMPS n'est plus supporté en Spring Boot 4 — géré via @JsonFormat dans les DTOs