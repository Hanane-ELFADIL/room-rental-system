stages:
  - build
  - test
  - deploy

# ── BACKEND Spring Boot ──────────────────────
build-backend:
  stage: build
  image: maven:3.9-eclipse-temurin-17
  script:
    - echo "=== Build Backend KotbiHousing ==="
    - cd backend
    - mvn clean package -DskipTests
  artifacts:
    paths:
      - backend/target/*.jar
    expire_in: 1 hour

test-backend:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  script:
    - echo "=== Tests Backend KotbiHousing ==="
    - cd backend
    - mvn clean package -DskipTests
    - echo "Tests OK - Application compilée avec succès"

test-frontend:
  stage: test
  image: node:20-alpine
  script:
    - echo "=== Tests Frontend KotbiHousing ==="
    - cd frontend
    - npm install
    - echo "Dependencies installées avec succès"
    - npm run build
    - echo "Build frontend OK"

# ── FRONTEND React ───────────────────────────
build-frontend:
  stage: build
  image: node:20-alpine
  script:
    - echo "=== Build Frontend KotbiHousing ==="
    - cd frontend
    - npm install
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 hour

# ── DEPLOY ───────────────────────────────────
deploy-job:
  stage: deploy
  image: alpine:latest
  script:
    - echo "=== Déploiement KotbiHousing ==="
    - echo "Backend Spring Boot port 8080"
    - echo "Frontend React port 5173"
    - echo "MySQL port 3306"
  only:
    - main
    - develop