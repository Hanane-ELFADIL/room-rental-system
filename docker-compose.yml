version: '3.8'

services:

  db:
    image: mysql:8.0
    container_name: kotbihousing-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: rooms_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./BD/rooms_db.sql:/docker-entrypoint-initdb.d/rooms_db.sql

  backend:
    build: ./backend
    container_name: kotbihousing-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/rooms_db?createDatabaseIfNotExist=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: kotbihousing-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data: